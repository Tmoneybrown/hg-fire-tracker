<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HG Fire project tracker for sprinkler design jobs.">
  <meta name="theme-color" content="#0f1535">
  <script>
    /* Apply the saved theme, or the OS preference, before first paint. */
    (function () {
      var key = "hg-tracker-theme";
      var theme = "light";
      try {
        var stored = localStorage.getItem(key);
        if (stored === "light" || stored === "dark") theme = stored;
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (e) {}
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0b0f1a" : "#0f1535");
    })();
  </script>
  <title>HG Fire Project Tracker</title>
  <link rel="icon" href="assets/hg-logo.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#app">Skip to jobs</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <div class="brand-mark">
        <img src="assets/hg-logo.png" alt="HG Fire" width="939" height="749">
      </div>
      <div class="header-text">
        <p class="eyebrow">HG Fire Systems</p>
        <h1>Project Tracker</h1>
        <p class="as-of">As of <time id="as-of"></time></p>
      </div>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-pressed="false" aria-label="Switch to dark theme">
        <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"></circle>
          <path d="M12 2.5v2.2M12 19.3v2.2M4.8 4.8l1.6 1.6M17.6 17.6l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.8 19.2l1.6-1.6M17.6 6.4l1.6-1.6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path>
        </svg>
        <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false">
          <path d="M20.5 14.8A8.2 8.2 0 0 1 10.2 3.5 8.2 8.2 0 1 0 20.5 14.8z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path>
        </svg>
        <span class="theme-label theme-label-light">Light</span>
        <span class="theme-label theme-label-dark">Dark</span>
      </button>
    </div>
  </header>
  <script>
    (function () {
      var dark = document.documentElement.getAttribute("data-theme") === "dark";
      var button = document.getElementById("theme-toggle");
      if (!button) return;
      button.setAttribute("aria-pressed", dark ? "true" : "false");
      button.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
    })();
  </script>
  <main id="app" class="wrap"></main>
  <footer class="site-footer">
    <div class="wrap">HG Fire design tracker</div>
  </footer>
  <noscript>
    <p class="noscript wrap">JavaScript is required to render jobs from data.js.</p>
  </noscript>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
